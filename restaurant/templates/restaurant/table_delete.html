{% extends 'base.html' %}

{% block title %}Удаление стола{% endblock %}

{% block content %}
<h2>Удаление стол</h2>
<p>Вы уверены, что хотите удалить стол номер "{{ table.number }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'restaurant:table_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
