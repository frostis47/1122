{% extends 'base.html' %}

{% block title %}Удаление заказа{% endblock %}

{% block content %}
<h2>Отмена заказа</h2>
<p>Вы уверены, что хотите отменить заказ ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Отменить</button>
    <a href="{% url 'restaurant:order_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
