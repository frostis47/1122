{% extends 'home.html'%}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        <div class="col">
          <div class="card shadow-sm">
            <div class="card-body">
                  <p class="card-text"> Стол № {{ orders.table.number }}</p>
                  <p class="card-text"> На {{ orders.date }} </p>
                  <p class="card-text"> В {{ orders.time }}</p>
                <div class="d-flex justify-content-between align-items-center">
                  <div class="btn-group, d-grid gap-2">
                    <a class="btn btn-primary" href="{% url 'restaurant:home' %}">Назад</a>
                    {% if user.is_authenticated and user.is_superuser %}
                    <a class="btn btn-primary" href="{% url 'restaurant:order_update' orders.pk %}">Редактировать</a>
                    {% endif %}
                    <a href="{% url 'restaurant:order_delete' orders.pk %}" class="btn btn-danger">Отменить</a>
                  </div>
                </div>
            </div>
          </div>
        </div>
      </div>
    </div>
</div>
{% endblock %}
